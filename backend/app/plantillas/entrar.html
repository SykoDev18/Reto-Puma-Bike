{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<h1>Panel del comité</h1>
<p class="sub">Reto Puma Bike · edición {{ edicion }}</p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/admin/entrar" style="max-width:22rem">
  <p>
    <label for="usuario">Usuario</label><br>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus
           style="width:100%">
  </p>
  <p>
    <label for="contrasena">Contraseña</label><br>
    <input id="contrasena" name="contrasena" type="password"
           autocomplete="current-password" required style="width:100%">
  </p>
  <button class="principal" type="submit">Entrar</button>
</form>

<p class="sub" style="margin-top:2rem">
  Las cuentas las crea el administrador por línea de comandos. No hay registro
  público.
</p>
{% endblock %}
